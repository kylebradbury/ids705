project:
  type: website
  output-dir: docs
  resources:
    - "/notebooks/data/**"
    - "/shared/**"
  render:
    - "*.qmd"
    - "*.ipynb"
    - "!assignments/*"
    - "!archive/*"
    - "!lectures/*"
    - "!solutions/*"
    - "!dev/*"

website:
  title: "IDS 705: Principles of Machine Learning (Spring 2027)"
  description: "Course website for IDS 705, Principles of Machine Learning, at Duke University (Spring 2027): an applied introduction to supervised, unsupervised, and reinforcement learning."
  site-url: https://kylebradbury.github.io/ids705/
  image: img/decision-boundaries.png
  favicon: img/favicon.svg
  open-graph: true
  twitter-card: true
  google-analytics: "G-63SKKDGFHG"
  # Drafts are rendered (reachable by direct link) but hidden from navigation and search.
  # To publish one, remove it from this list and add it to the sidebar.
  drafts:
    - project.qmd
    - other_ideas.qmd
  draft-mode: unlinked
  navbar:
    title: "IDS 705 · Principles of Machine Learning · 2027"
    left:
      - href: ./schedule.qmd
        text: Schedule
      # - href: https://canvas.duke.edu/courses/72635
      #   text: Canvas
      # - href: https://edstem.org/us/courses/90514
      #   text: Ed Discussions
      # - href: https://www.gradescope.com/courses/1208262
      #   text: Gradescope
  page-footer:
    left: "[Kyle Bradbury](https://kylebradbury.org)"
    center: "[Duke University](https://duke.edu) · [MIDS](https://datascience.duke.edu)"
    right: "[Past Offerings](/history.qmd) · [Source](https://github.com/kylebradbury/ids705)"
  sidebar:
    # style: "docked"
    search: true
    contents:
      - index.qmd
      - section: "Course Info"
        contents:
          - schedule.qmd
          - syllabus.qmd
          - contacts.qmd
          - pedagogy.qmd
          - ai.qmd
      - section: "Assignments"
        contents:
          - notebooks/assignment_instructions.ipynb
          # - notebooks/assignment1.ipynb
          # - notebooks/assignment2.ipynb
          # - notebooks/assignment3.ipynb
          # - notebooks/assignment4.ipynb
          # - notebooks/assignment5.ipynb
          # - notebooks/assignment6.ipynb
          # - project.qmd
      - section: "Resources"
        contents:
          - tools.qmd
          - resources.qmd
          - text: "File Structure Template"
            href: https://github.com/kylebradbury/ml-project-structure-demo
format:
  html:
    # Site styling: see STYLE_GUIDE.md for how to change or revert each choice.
    # Listing light first makes light the default; _color-scheme.html then
    # follows each visitor's system setting until they use the navbar toggle.
    theme:
      light: [cosmo, theme.scss, theme-light.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    css: styles.css
    include-in-header: _color-scheme.html
    toc: true
    grid:
      body-width: 1100px
