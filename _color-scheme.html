<script>
// Dark mode (choice F2): follow the visitor's system light/dark setting until
// they click the theme toggle in the navbar; after that, keep their choice.
// Quarto stores the toggle state as "quarto-color-scheme": "alternate" means
// dark here, because the light theme is listed first in _quarto.yml.
// To make the site always start in light mode, delete this file and its
// include-in-header line in _quarto.yml.
(function () {
  try {
    var KEY = "quarto-color-scheme", AUTO = "ids705-color-scheme-auto";
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (localStorage.getItem(KEY) === null || localStorage.getItem(AUTO) === "1") {
      localStorage.setItem(KEY, mq && mq.matches ? "alternate" : "default");
      localStorage.setItem(AUTO, "1");
    }
    // A click on the toggle is an explicit choice: stop following the system setting.
    document.addEventListener("click", function (e) {
      if (e.target.closest && e.target.closest(".quarto-color-scheme-toggle")) localStorage.removeItem(AUTO);
    }, true);
    // If the system setting changes while the page is open, follow it (unless the visitor chose).
    if (mq && mq.addEventListener) mq.addEventListener("change", function (ev) {
      if (localStorage.getItem(AUTO) !== "1" || !window.quartoToggleColorScheme) return;
      if (ev.matches !== (localStorage.getItem(KEY) === "alternate")) window.quartoToggleColorScheme();
    });
  } catch (e) { /* storage unavailable: Quarto falls back to light mode */ }
})();
</script>
